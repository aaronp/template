# Publishes the dashboard, docs/ and their cards to GitHub Pages, without Jekyll,
# so .md files are served raw for the tools to fetch.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The tools, for this repo's own docs and the demo; the CLI itself runs on node.
      - run: bun install
      - run: node bin/project.mjs --manifest ./manifest.json build --out _site --pages https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # The template landing page and what it loads, the manifest and card scripts for `npx @pritzlaff/project`,
      # and Main.dc.html redirecting old links to dashboard.html.
      - run: cp -R Template.dc.html index.html Main.dc.html manifest.json cards vendor support.js _site/
      # Template repo only: the filled-in Acme demo, published at <site>/demo/.
      - if: hashFiles('examples/acme/docs/**') != ''
        run: |
          make demo-build DEMO=_site/demo DEMO_PAGES=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo/
          cp Main.dc.html _site/demo/
      # Template repo only: the React app example, the app at <site>/react-app/ and its dashboard under react-app/project/.
      - if: hashFiles('examples/react-app/package.json') != ''
        run: make react-app-build REACT_APP=_site/react-app REACT_APP_PAGES=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/react-app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
