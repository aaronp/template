# Publishes the repo (dashboard, docs/ and generated summaries) to GitHub Pages, without Jekyll,
# so .md files are served raw for the tools to fetch.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Cards are committed, but rebuild (-B) so links point here and revisit-due counts reflect the deploy date.
      - run: make -B snapshot PAGES=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Template repo only (clones have no examples/): the filled-in Acme demo, published at <site>/demo/.
      - if: hashFiles('examples/acme/docs/**') != ''
        run: make demo-build DEMO=demo DEMO_REPO=${{ github.repository }} DEMO_PAGES=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
